# Scan the Dockerfile for issue & CVEs
name: Docker Lint New
on: 
  push:
    branches: [main]
jobs:
  Validate-Dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: validate dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.multistage
          
