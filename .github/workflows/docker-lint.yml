# Scan the Dockerfile for issue & CVEs
name: Docker Lint
on: 
  workflow_call: 

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python ${{ matrix.python-version}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version}}

      - name: install dependancies
        run: pip install -r requirements --no-cache

      - name: run linter
        run: flake8

      - name: run SAST
        run: bandit -r app.py
        
    
  
  
