# API Keys, sensitive data, credentials
# GitLeaks
name: Secret Scan

on: 
  push:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: run gitleaks scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # github action manages it.
          
          
         
