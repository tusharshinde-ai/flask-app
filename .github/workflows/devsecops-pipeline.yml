name: DevSecOps End to End Pipeline

on: workflow_dispatch

jobs:
  # CI (continuous Integration with security scanning) 
  code-quality: 
    uses: ./.github/workflows/code-quality.yml

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit

  dependancy-scan:
    uses: ./.github/workflows/dependency-scan.yml

  docker-scan:
    uses: ./.github/workflows/docker-lint-new.yml
  # Build once the security scans are completed.
  build:
    needs: [code-quality, secret-scan, dependancy-scan, docker-scan]
    uses: ./.github/workflows/docker-build-push.yml
    secrets: inherit

    
    
