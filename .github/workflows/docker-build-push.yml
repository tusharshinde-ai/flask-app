
name: Docker Build and Push

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USER }}/${{ github.event.repository.name }}:${{ github.ref_name }}
            ${{ vars.DOCKERHUB_USER }}/${{ github.event.repository.name }}:latest
            ${{ vars.DOCKERHUB_USER }}/${{ github.event.repository.name }}:${{ github.sha }}
