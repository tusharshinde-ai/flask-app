name: docker build and push

on: 
  workflow_dispatch:  
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push to docker hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
              ${{ vars.DOCKERHUB_USER }}/${{ github.event.repository.name }}:${{ github.ref_name }} # branch
              ${{ vars.DOCKERHUB_USER }}/${{ github.event.repository.name }}:latest
              ${{ vars.DOCKERHUB_USER }}/${{ github.event.repository.name }}:${{ github.sha }} # commit ID
          
          
